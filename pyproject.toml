[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"
[project]
name = "kujo-hermes"
version = "0.1.0"
description = "Native Hermes integration for Kujo engineering, context, verification and execution tools"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]
license = {text = "MIT"}
[tool.setuptools.packages.find]
include = ["kujo_hermes*"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

name: kujo-hermes
repo: https://github.com/kujolang/kujo-hermes
sha: 61e3b216570bcd40e5fb5c3f489278440086fcfa
description: >-
  Native discovery and execution of Kujo engineering, context, verification and
  orchestration tools with explicit human approvals and local execution receipts.
  Requires separately installed canonical Kujo runtime and source tooling.
maintainer: kujolang
tier: community
category: tools
docs_url: https://github.com/kujolang/kujo-hermes#readme
version: "0.1.0"
requires_hermes: ">=0.22.7"
platforms: [macos, linux]
capabilities:
  provides_tools:
    - kujo_discover
    - kujo_inspect
    - kujo_execute
    - kujo_status
    - kujo_receipts
    - kujo_doctor
  provides_hooks:
    - pre_tool_call
    - post_approval_response
  provides_middleware: []
  requires_env: []

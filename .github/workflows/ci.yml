name: verify
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
  host:
    strategy:
      matrix:
        hermes: [v0.22.7, v0.23.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: git clone --depth 1 --branch ${{ matrix.hermes }} https://github.com/NousResearch/hermes-agent.git /tmp/hermes
      - run: uv sync --project /tmp/hermes --locked --no-default-groups
        env:
          UV_PROJECT_ENVIRONMENT: /tmp/hermes-env
      - run: uv pip install --python /tmp/hermes-env/bin/python -e .
      - run: /tmp/hermes-env/bin/python -m hermes_cli.main plugins doctor "$PWD"
      - run: /tmp/hermes-env/bin/python -m hermes_cli.main plugins validate "$PWD" --install-deps
      - name: Install plugin into a clean Hermes home
        run: |
          /tmp/hermes-env/bin/python -m hermes_cli.main plugins install https://github.com/kujolang/kujo-hermes --ref "$GITHUB_SHA" --yes-deps --no-enable | tee evidence/clean-install.txt
          test -f "$HERMES_HOME/plugins/kujo-hermes/plugin.yaml"
        env:
          HERMES_HOME: ${{ runner.temp }}/kujo-clean-home
      - run: npm ci --prefix scripts/ci-runtime --ignore-scripts
      - run: /tmp/hermes-env/bin/python scripts/install-sources.py --destination /tmp/kujo-sources --only shipcheck packwrite spec eval scout kujo-workflows
      - run: /tmp/hermes-env/bin/python tests/hermes_e2e.py --sources /tmp/kujo-sources --kujo scripts/ci-runtime/node_modules/@kujolang/kujo-linux-x64/bin/kujo --isolation host
      - name: Reproduce checkout failure and correction through native tools
        run: /tmp/hermes-env/bin/python demo/checkout/run.py --sources /tmp/kujo-sources --kujo scripts/ci-runtime/node_modules/@kujolang/kujo-linux-x64/bin/kujo --output /tmp/checkout-evidence --test-decisions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-linux-e2e-${{ matrix.hermes }}
          path: |
            evidence/hermes-e2e.json
            evidence/clean-install.txt
            /tmp/checkout-evidence/run.json
            /tmp/checkout-evidence/*-receipt.json
